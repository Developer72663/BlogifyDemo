name: Apply shared profile click fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make shared profile card clickable') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch message.ejs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('views/message.ejs')
          s = p.read_text(encoding='utf-8')
          old = '''        bubble.addEventListener(\n          "click",\n          () => {\n\n            if(\n              m.mediaType === "profile" &&\n              m.profileShareId &&\n              m.profileShareId._id\n            ){\n\n              location.href =\n                "/profile/" +\n                encodeURIComponent(\n                  m.profileShareId._id\n                );\n\n              return;\n\n            }\n\n            if(!m.deleted)\n              openSheet(m);\n\n          }\n        );'''
          new = '''        bubble.addEventListener(\n          "click",\n          (event) => {\n\n            if(\n              m.mediaType === "profile" &&\n              m.profileShareId\n            ){\n\n              event.preventDefault();\n              event.stopPropagation();\n\n              const profileId =\n                typeof m.profileShareId === "object"\n                  ? (m.profileShareId._id || m.profileShareId.id)\n                  : m.profileShareId;\n\n              if(profileId){\n                window.location.assign(\n                  "/profile/" +\n                  encodeURIComponent(String(profileId))\n                );\n              }\n\n              return;\n\n            }\n\n            if(!m.deleted)\n              openSheet(m);\n\n          },\n          true\n        );'''
          if old not in s:
              raise SystemExit('Expected message.ejs profile click block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -n -A35 -B5 'window.location.assign' views/message.ejs
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-shared-profile-click.yml
          git add views/message.ejs .github/workflows/fix-shared-profile-click.yml
          git commit -m 'fix: make shared profile card clickable'
          git push