name: Blogify message UI upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-messaging:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply messaging upgrade
        shell: python
        run: |
          from pathlib import Path
          js = r'''(() => {
            'use strict';
            if (!location.pathname.startsWith('/messages')) return;
            const MAX_IMAGE = 10 * 1024 * 1024;
            const MAX_VIDEO = 50 * 1024 * 1024;
            const ALLOWED = new Set(['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime']);
            const $ = (s, root=document) => root.querySelector(s);
            function toast(message){ if(typeof window.toast==='function') return window.toast(message); if(window.notify?.info) return window.notify.info(message); console.info('[Blogify Messages]',message); }
            function injectStyle(){
              if($('#blogify-message-ux-style')) return;
              const style=document.createElement('style'); style.id='blogify-message-ux-style';
              style.textContent=`
                .blogify-media-lightbox{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.9);display:none;place-items:center;padding:18px;backdrop-filter:blur(10px)}
                .blogify-media-lightbox.open{display:grid}
                .blogify-media-lightbox .media-stage{position:relative;max-width:min(1100px,96vw);max-height:92vh;display:grid;place-items:center}
                .blogify-media-lightbox img,.blogify-media-lightbox video{display:block;max-width:96vw;max-height:88vh;border-radius:16px;object-fit:contain;background:#000}
                .blogify-media-lightbox .media-close,.blogify-media-lightbox .media-download{position:fixed;top:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;cursor:pointer}
                .blogify-media-lightbox .media-close{right:14px;font-size:24px}.blogify-media-lightbox .media-download{right:66px;font-size:20px}
                .blogify-upload-menu{position:absolute;left:8px;bottom:calc(100% + 8px);width:210px;padding:8px;background:var(--surface,#fff);border:1px solid var(--line,#ddd);border-radius:16px;box-shadow:0 15px 45px rgba(0,0,0,.2);display:none;z-index:200}
                .blogify-upload-menu.open{display:block}.blogify-upload-menu button{width:100%;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--text,#111);display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;cursor:pointer}.blogify-upload-menu button:hover{background:var(--input,#f2f2f4)}
                .blogify-drop-active{outline:2px dashed #3797f0;outline-offset:-5px;background:rgba(55,151,240,.05)!important}.blogify-media-hint{font-size:10px;color:var(--muted,#737373);padding:0 10px 5px}
                @media(max-width:600px){.blogify-upload-menu{left:4px;width:190px}.blogify-media-lightbox{padding:8px}.blogify-media-lightbox img,.blogify-media-lightbox video{max-width:100vw;max-height:84vh;border-radius:10px}}
              `; document.head.appendChild(style);
            }
            function setupLightbox(){
              const area=$('.messages-area'); if(!area||area.dataset.blogifyLightbox==='1') return; area.dataset.blogifyLightbox='1';
              const overlay=document.createElement('div'); overlay.className='blogify-media-lightbox'; overlay.setAttribute('aria-hidden','true');
              overlay.innerHTML='<div class="media-stage" id="blogifyMediaStage"></div><button class="media-close" type="button" aria-label="Close media">×</button><a class="media-download" id="blogifyMediaDownload" aria-label="Download media" target="_blank" rel="noopener">↓</a>';
              document.body.appendChild(overlay); const stage=$('#blogifyMediaStage',overlay), close=$('.media-close',overlay), download=$('#blogifyMediaDownload',overlay);
              const hide=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');stage.replaceChildren();document.body.style.overflow='';};
              close.addEventListener('click',hide); overlay.addEventListener('click',e=>{if(e.target===overlay)hide()}); document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
              area.addEventListener('click',e=>{const media=e.target.closest('.message-media');if(!media||!area.contains(media))return;e.preventDefault();const src=media.currentSrc||media.src;if(!src)return;const clone=media.tagName==='VIDEO'?document.createElement('video'):document.createElement('img');clone.src=src;if(clone.tagName==='VIDEO'){clone.controls=true;clone.playsInline=true}clone.alt=media.alt||'Shared media';stage.appendChild(clone);download.href=src;download.download='blogify-media';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';});
            }
            function validateFile(file){
              if(!file)return false;
              if(!ALLOWED.has(file.type)){toast('Unsupported media type. Use JPG, PNG, WebP, GIF, MP4 or WebM.');return false;}
              const limit=file.type.startsWith('video/')?MAX_VIDEO:MAX_IMAGE;
              if(file.size>limit){toast(`File is too large. Maximum is ${file.type.startsWith('video/')?'50 MB':'10 MB'}.`);return false;}
              return true;
            }
            function setupUploadUX(){
              const composer=$('.composer'),input=$('#input'),attachment=$('#attachmentButton'); if(!composer||!input||!attachment||composer.dataset.blogifyUploadUX==='1')return; composer.dataset.blogifyUploadUX='1';
              const wrap=attachment.parentElement; if(getComputedStyle(wrap).position==='static')wrap.style.position='relative';
              const menu=document.createElement('div');menu.className='blogify-upload-menu';menu.innerHTML='<div class="blogify-media-hint">Share something</div><button type="button" data-kind="image"><i class="fas fa-image"></i> Photo</button><button type="button" data-kind="video"><i class="fas fa-video"></i> Video</button>';wrap.appendChild(menu);
              const fileInput=document.querySelector('input[type="file"]');
              const toggle=e=>{e.preventDefault();e.stopPropagation();menu.classList.toggle('open')}; attachment.addEventListener('click',toggle,true);
              menu.addEventListener('click',e=>{const btn=e.target.closest('button[data-kind]');if(!btn||!fileInput)return;menu.classList.remove('open');fileInput.accept=btn.dataset.kind==='video'?'video/mp4,video/webm,video/quicktime':'image/jpeg,image/png,image/webp,image/gif';fileInput.click()});
              document.addEventListener('click',e=>{if(!wrap.contains(e.target))menu.classList.remove('open')});
              const inspect=files=>{const file=files?.[0];if(file&&!validateFile(file))try{fileInput.value=''}catch(_){}};
              fileInput?.addEventListener('change',()=>inspect(fileInput.files));
              ['dragenter','dragover'].forEach(type=>composer.addEventListener(type,e=>{e.preventDefault();composer.classList.add('blogify-drop-active')}));
              ['dragleave','drop'].forEach(type=>composer.addEventListener(type,e=>{e.preventDefault();composer.classList.remove('blogify-drop-active')}));
              composer.addEventListener('drop',e=>{const file=e.dataTransfer?.files?.[0];if(!file||!validateFile(file)||!fileInput)return;try{const dt=new DataTransfer();dt.items.add(file);fileInput.files=dt.files;fileInput.dispatchEvent(new Event('change',{bubbles:true}))}catch(_){toast('Please use the attachment button for this browser.')}});
              input.addEventListener('paste',e=>{const file=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(!file||!validateFile(file)||!fileInput)return;try{const dt=new DataTransfer();dt.items.add(file);fileInput.files=dt.files;fileInput.dispatchEvent(new Event('change',{bubbles:true}));toast('Image attached')}catch(_){}});
            }
            function addComposerStatus(){const composer=$('.composer');if(!composer||$('#blogifyMediaHint'))return;const hint=document.createElement('div');hint.id='blogifyMediaHint';hint.style.cssText='position:absolute;left:8px;bottom:2px;font-size:9px;color:var(--muted,#737373);pointer-events:none;opacity:.75';hint.textContent='Photos up to 10 MB • Videos up to 50 MB';composer.style.position='relative';composer.appendChild(hint)}
            function setup(){injectStyle();setupLightbox();setupUploadUX();addComposerStatus()}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
            new MutationObserver(setup).observe(document.body,{childList:true,subtree:true});
          })();'''
          Path('public/js').mkdir(parents=True, exist_ok=True)
          Path('public/js/messaging-enhancements.js').write_text(js, encoding='utf-8')
          partial=Path('views/partials/scripts.ejs'); text=partial.read_text(encoding='utf-8')
          tag='<script src="/js/messaging-enhancements.js" defer></script>'
          if tag not in text: partial.write_text(text.rstrip()+'\n'+tag+'\n', encoding='utf-8')

      - name: Commit upgrade and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/messaging-enhancements.js views/partials/scripts.ejs
          git rm .github/workflows/blogify-message-upgrade.yml
          git commit -m "feat: upgrade Blogify messaging media UX [skip ci]"
          git push
