name: Fix shared profile messages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared profile click fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('views/message.ejs')
          text = path.read_text(encoding='utf-8')

          old = '''        bubble.addEventListener(\n          "click",\n          () => {\n\n            if(!m.deleted)\n              openSheet(m);\n\n          }\n        );'''

          new = '''        bubble.addEventListener(\n          "click",\n          () => {\n\n            if(\n              m.mediaType === "profile" &&\n              m.profileShareId &&\n              m.profileShareId._id\n            ){\n\n              location.href =\n                "/profile/" +\n                encodeURIComponent(\n                  m.profileShareId._id\n                );\n\n              return;\n\n            }\n\n            if(!m.deleted)\n              openSheet(m);\n\n          }\n        );'''

          if old not in text:
              raise SystemExit('Expected message click handler was not found')

          text = text.replace(old, new, 1)

          old_css = '''    .profile-card{\n      width:min(270px,70vw);\n      border:1px solid var(--line);\n      background:var(--surface);\n      border-radius:16px;\n      overflow:hidden;\n    }'''

          new_css = '''    .profile-card{\n      width:min(270px,70vw);\n      border:1px solid var(--line);\n      background:var(--surface);\n      border-radius:16px;\n      overflow:hidden;\n      cursor:pointer;\n    }'''

          if old_css in text:
              text = text.replace(old_css, new_css, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add views/message.ejs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: open shared profiles from messages'
          git push
